apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: snowflake-worker
  namespace: default
  labels:
    app: snowflake-saas
    tier: id-generator
spec:
  serviceName: "snowflake-worker-headless"
  replicas: 3
  selector:
    matchLabels:
      app: snowflake-saas
  template:
    metadata:
      labels:
        app: snowflake-saas
        tier: id-generator
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - snowflake-saas
                topologyKey: kubernetes.io/hostname
      containers:
        - name: id-generator
          image: snowflake-saas:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: DATACENTER_ID
              valueFrom:
                configMapKeyRef:
                  name: snowflake-saas-config
                  key: DATACENTER_ID
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 1000m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: snowflake-saas-service
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: snowflake-saas
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: snowflake-worker-headless
  namespace: default
spec:
  clusterIP: None
  selector:
    app: snowflake-saas
  ports:
    - name: http
      port: 8080
