version: '3.8'

services:
  snowflake-worker-0:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: snowflake-worker-0
    environment:
      - POD_NAME=snowflake-worker-0
      - MACHINE_ID=0
      - DATACENTER_ID=0
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 3
    restart: always

  snowflake-worker-1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: snowflake-worker-1
    environment:
      - POD_NAME=snowflake-worker-1
      - MACHINE_ID=1
      - DATACENTER_ID=0
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 3
    restart: always

  snowflake-worker-2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: snowflake-worker-2
    environment:
      - POD_NAME=snowflake-worker-2
      - MACHINE_ID=2
      - DATACENTER_ID=0
    ports:
      - "8082:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 3
    restart: always
