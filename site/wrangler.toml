name = "snowflake-lite-site"
main = "src/worker.js"
compatibility_date = "2026-10-01"

[vars]
GITHUB_REPO = "ysinghc/snowflake-lite"

[[routes]]
pattern = "snowflake.ysinghc.in"
custom_domain = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "404-page"
